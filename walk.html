<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="なかやま商店街ストリートを360°の歩行者目線で巡るバーチャル散歩です。">
<title>なかやま360°散歩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://tourmake.it">
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF4E2; --paper-deep:#F1E5C8; --ink:#5C4327; --ink-soft:#7A5C3B;
    --accent:#C97B3D; --voice:#26747B;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; }
  body{ display:flex; flex-direction:column; overflow:hidden; background:var(--paper); color:var(--ink);
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif; }
  .walk-header{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top)); border-bottom:2px dashed rgba(92,67,39,.35); background:var(--paper); }
  .brand{ min-width:0; }
  .brand h1{ font-family:'Yusei Magic',sans-serif; font-size:1.12rem; line-height:1.25; }
  .brand p{ margin-top:2px; color:var(--ink-soft); font-size:.7rem; }
  .view-switch{ display:inline-flex; align-items:center; flex:0 0 auto; padding:3px; border:1.5px solid rgba(122,92,59,.42);
    border-radius:999px; background:#fffaf0; }
  .view-switch a{ display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:6px 11px;
    border-radius:999px; color:var(--ink-soft); font-size:.72rem; font-weight:700; text-decoration:none; white-space:nowrap; }
  .view-switch a[aria-current="page"]{ background:var(--ink); color:#fffaf0; }
  .view-switch a:focus-visible, .external-link:focus-visible{ outline:3px solid rgba(201,123,61,.45); outline-offset:2px; }
  .walk-info{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:8px 14px;
    border-bottom:1px solid rgba(122,92,59,.22); background:#fffaf0; }
  .walk-info p{ color:var(--ink-soft); font-size:.78rem; line-height:1.45; }
  .walk-info strong{ color:var(--voice); }
  .external-link{ display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; min-height:44px;
    padding:8px 13px; border:2px solid var(--accent); border-radius:999px; color:var(--accent); font-size:.75rem;
    font-weight:700; text-decoration:none; white-space:nowrap; }
  .walk-stage{ position:relative; flex:1; min-height:0; background:#e8ddc6; }
  .walk-stage iframe{ display:block; width:100%; height:100%; border:0; background:#e8ddc6; }
  .loading-card{ position:absolute; inset:50% auto auto 50%; z-index:2; transform:translate(-50%,-50%); display:grid;
    justify-items:center; gap:10px; min-width:min(280px,calc(100vw - 40px)); padding:18px 20px; border:2px solid #d8c4a0;
    border-radius:16px; background:rgba(255,250,240,.96); box-shadow:0 12px 30px rgba(80,60,30,.22);
    color:var(--ink-soft); font-size:.82rem; text-align:center; transition:opacity .2s ease, visibility .2s ease; }
  .spinner{ width:28px; height:28px; border:3px solid var(--paper-deep); border-top-color:var(--voice); border-radius:50%;
    animation:spin .8s linear infinite; }
  body.tour-loaded .loading-card{ opacity:0; visibility:hidden; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media(max-width:680px){
    .walk-header{ gap:8px; padding-inline:10px; }
    .brand h1{ font-size:.98rem; }
    .brand p{ display:none; }
    .view-switch a{ padding-inline:8px; font-size:.68rem; }
    .walk-info{ align-items:stretch; padding:7px 10px; }
    .walk-info p{ align-self:center; font-size:.7rem; }
    .external-link{ min-height:44px; padding-inline:10px; font-size:.68rem; }
  }
  @media(max-width:420px){
    .walk-info p span{ display:none; }
  }
  @media(prefers-reduced-motion:reduce){
    .spinner{ animation:none; }
    .loading-card{ transition:none; }
  }
</style>
</head>
<body>
<header class="walk-header">
  <div class="brand">
    <h1>なかやま360°散歩</h1>
    <p>商店街を、道を歩く目線で巡れます</p>
  </div>
  <nav class="view-switch" aria-label="表示を切り替える">
    <a href="./">地図</a>
    <a href="walk.html" aria-current="page">360°散歩</a>
  </nav>
</header>

<div class="walk-info">
  <p><strong>画面をドラッグ</strong>して見回し、<strong>道の矢印</strong>を押して進みます。<span>左上のMAPから場所を選ぶこともできます。</span></p>
  <a class="external-link" href="https://tourmake.it/nakayaman" target="_blank" rel="noopener">全画面で開く ↗</a>
</div>

<main class="walk-stage">
  <div class="loading-card" id="loadingCard" role="status">
    <span class="spinner" aria-hidden="true"></span>
    <span>360°散歩を読み込んでいます</span>
  </div>
  <iframe id="tourFrame" src="https://tourmake.it/nakayaman" title="中山地域360°バーチャル散歩"
    loading="eager" allow="fullscreen; accelerometer; gyroscope; xr-spatial-tracking" allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <noscript><p><a href="https://tourmake.it/nakayaman">中山地域360°バーチャル散歩を開く</a></p></noscript>
</main>

<script>
  document.getElementById('tourFrame').addEventListener('load', () => {
    document.body.classList.add('tour-loaded');
    document.getElementById('loadingCard').setAttribute('aria-label', '360°散歩を読み込みました');
  });
</script>
</body>
</html>
