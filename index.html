<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なかやま商店街 デジタルガイドマップ</title>
<style>
  :root{
    --bg:#f3e7cc; --ink:#5b4a3a; --paper:#fffaf0; --line:#d8c4a0;
    --c-medical:#2a9488; --c-life:#4a9d3f; --c-food:#e8902f; --c-edu:#7e7ad0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro",
                "Yu Gothic UI","Meiryo",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%;
  }
  header{ text-align:center; padding:16px 16px 2px; }
  header h1{ margin:0; font-size:clamp(18px,4.6vw,27px); color:#6b5036 }
  header p{ margin:6px 12px 0; font-size:clamp(11px,3vw,13px); color:#9a8763 }

  .filters{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center;
    padding:11px 12px 4px; max-width:760px; margin:0 auto; }
  .hint{ text-align:center; font-size:clamp(10px,2.8vw,12px); color:#9a8763; margin:2px 16px 0 }
  .chip-f{ border:2px solid currentColor; background:#fffaf0; color:var(--ink);
    border-radius:999px; padding:5px 12px; font-size:clamp(11px,3vw,12.5px); font-weight:700;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; user-select:none;
    transition:transform .08s, background .15s; }
  .chip-f:active{ transform:scale(.95) }
  .chip-f .dot{ width:10px; height:10px; border-radius:50%; background:currentColor }
  .chip-f[aria-pressed="true"]{ background:currentColor }
  .chip-f[aria-pressed="true"] .lbl{ color:#fff } .chip-f[aria-pressed="true"] .dot{ background:#fff }
  .chip-f.c-medical{ color:var(--c-medical) } .chip-f.c-life{ color:var(--c-life) }
  .chip-f.c-food{ color:var(--c-food) } .chip-f.c-edu{ color:var(--c-edu) }

  /* マップ：公式画像を土台に（位置関係＝原図と一致） */
  .map-wrap{ position:relative; width:100%; max-width:720px; margin:8px auto;
    aspect-ratio:977/1339; border:3px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:0 8px 24px rgba(120,100,60,.2); background:#fff;
    container-type:inline-size; }
  .map-wrap img.base{ position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }

  /* クリック領域（透明＝文字を隠さない） */
  .hit{ position:absolute; transform:translate(-50%,-50%);
    width:15cqw; height:3cqw; border-radius:1.2cqw; cursor:pointer;
    background:transparent; border:0; padding:0; z-index:2; }
  .hit.compact{ width:13cqw; height:2.4cqw }
  .hit::before{ content:""; position:absolute; inset:0; border-radius:inherit;
    background:transparent; transition:background .12s, box-shadow .12s; }
  .hit:hover::before,.hit:focus-visible::before{ background:rgba(255,214,120,.34);
    box-shadow:0 0 0 2px rgba(210,150,40,.5); outline:none; }
  /* カテゴリ強調（チップON時に光る） */
  .hit.glow::before{ background:var(--gl,rgba(255,214,120,.2));
    box-shadow:0 0 0 2.5px var(--gc,#e8902f); animation:gp 1.6s infinite; }
  @keyframes gp{ 0%,100%{ box-shadow:0 0 0 2px var(--gc) } 50%{ box-shadow:0 0 0 4px var(--gc) } }
  .hit.c-medical{ --gc:#2a9488; --gl:rgba(42,148,136,.18) }
  .hit.c-life{ --gc:#4a9d3f; --gl:rgba(74,157,63,.18) }
  .hit.c-food{ --gc:#e8902f; --gl:rgba(232,144,47,.2) }
  .hit.c-edu{ --gc:#7e7ad0; --gl:rgba(126,122,208,.2) }
  body.debug .hit::before{ background:rgba(255,90,90,.18); box-shadow:0 0 0 1px rgba(220,0,0,.5) }
  body.debug .hit .num{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:9px; color:#a00; font-weight:700 }
  .hit .num{ display:none } body.debug .hit .num{ display:block }

  /* ポップアップ */
  .popup{ position:absolute; z-index:20; width:212px; max-width:76vw;
    background:#fffaf0; border:2px solid var(--line); border-radius:14px;
    box-shadow:0 12px 28px rgba(80,60,30,.34); padding:11px 12px 12px;
    opacity:0; pointer-events:none; transition:opacity .14s;
    transform:translate(-50%,calc(-100% - 14px)); }
  .popup.below{ transform:translate(-50%,14px) }
  .popup.show{ opacity:1; pointer-events:auto }
  .popup::after{ content:""; position:absolute; left:50%; bottom:-11px; transform:translateX(-50%);
    border:10px solid transparent; border-top-color:#fffaf0; filter:drop-shadow(0 2px 1px rgba(80,60,30,.18)); }
  .popup.below::after{ bottom:auto; top:-11px; border-top-color:transparent; border-bottom-color:#fffaf0;
    filter:drop-shadow(0 -2px 1px rgba(80,60,30,.18)); }
  .popup .cat{ font-size:11px; font-weight:700; color:#fff; padding:2px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; margin-bottom:7px }
  .popup .cat .ic{ width:15px; height:15px } .popup .cat .ic svg{ width:100%; height:100% }
  .popup h3{ margin:0 0 7px; font-size:15.5px; color:#5b4a3a }
  .popup .voices{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px }
  .popup .voices:empty{ display:none }
  .voice{ background:#f3e7cc; border-radius:10px 10px 10px 2px; padding:6px 9px; font-size:12.5px; line-height:1.45 }
  .voice .who{ display:block; margin-top:3px; font-size:10.5px; color:#9a8763 }
  .popup .go{ display:flex; align-items:center; justify-content:center; gap:5px; width:100%;
    text-decoration:none; color:#fff; font-weight:700; padding:9px; border-radius:10px; font-size:13px }
  .popup .go.disabled{ background:#c2b49a; pointer-events:none }
  .popup .close{ position:absolute; top:5px; right:9px; border:0; background:none; font-size:18px; color:#b3a690; cursor:pointer; line-height:1 }
  /* 密集エリアの「どのお店？」選択窓 */
  .chooser{ position:absolute; z-index:21; width:210px; max-width:80vw;
    background:#fffaf0; border:2px solid var(--line); border-radius:14px;
    box-shadow:0 12px 28px rgba(80,60,30,.34); padding:9px 9px 7px;
    opacity:0; pointer-events:none; transition:opacity .14s;
    transform:translate(-50%,calc(-100% - 14px)); }
  .chooser.below{ transform:translate(-50%,14px) }
  .chooser.show{ opacity:1; pointer-events:auto }
  .chooser .ctitle{ font-size:11px; color:#9a8763; font-weight:700; text-align:center; margin:1px 0 7px }
  .chooser .copt{ display:flex; align-items:center; gap:9px; width:100%; min-height:44px;
    border:1.5px solid var(--line); border-radius:10px; background:#fffdf7; color:var(--ink);
    font-weight:700; font-size:13.5px; line-height:1.3; padding:7px 10px; margin-bottom:6px;
    cursor:pointer; text-align:left }
  .chooser .copt:last-child{ margin-bottom:0 }
  .chooser .copt:active{ transform:scale(.99); background:#f3e7cc }
  .chooser .copt .cdot{ width:13px; height:13px; border-radius:50%; flex:0 0 auto }
  .chooser .copt .cnm{ flex:1 1 auto }
  .shoplist{ max-width:720px; margin:4px auto 8px; padding:0 14px }
  .sl-title{ font-size:clamp(15px,4vw,18px); color:#6b5036; margin:10px 0 2px; text-align:center }
  .sl-hint{ font-size:clamp(10px,2.8vw,12px); color:#9a8763; text-align:center; margin:0 0 8px }
  .srow{ display:flex; align-items:center; gap:10px; min-height:48px; padding:8px 12px;
    border:1.5px solid var(--line); border-radius:12px; background:var(--paper); margin-bottom:7px;
    text-decoration:none; color:var(--ink); font-size:clamp(13px,3.6vw,15px); font-weight:600;
    transition:transform .08s, background .15s }
  .srow:active{ transform:scale(.99); background:#f3e7cc }
  .srow .cdot{ width:13px; height:13px; border-radius:50%; flex:0 0 auto }
  .srow.c-medical .cdot{ background:var(--c-medical) }
  .srow.c-life .cdot{ background:var(--c-life) }
  .srow.c-food .cdot{ background:var(--c-food) }
  .srow.c-edu .cdot{ background:var(--c-edu) }
  .srow .sname{ flex:1 1 auto; line-height:1.35 }
  .srow .sgo{ flex:0 0 auto; font-weight:700; color:var(--c-food) }
  .srow.disabled{ pointer-events:none; opacity:.6 }
  .srow.disabled .sgo{ color:#a59576; font-size:12px; font-weight:600 }
  .note{ text-align:center; font-size:clamp(10px,2.8vw,11px); color:#a59576; margin:6px 16px 26px; line-height:1.6 }
</style>

const mapWrap = document.getElementById('mapWrap');
const popup = document.getElementById('popup');
const popupCat = document.getElementById('popupCat');
const popupName = document.getElementById('popupName');
const popupVoices = document.getElementById('popupVoices');
const popupGo = document.getElementById('popupGo');
const shopList = document.getElementById('shopList');
const chooser = document.getElementById('chooser');
let pinned = null;
if (location.search.indexOf('debug') >= 0) document.body.classList.add('debug');

STORES.forEach((s, i) => {
  const btn = document.createElement('button');
  const compact = (s.x >= 50 && s.x <= 63);
  btn.className = `hit c-${s.cat}${compact?' compact':''}`;
  btn.style.left = s.x + '%';
  btn.style.top  = s.y + '%';
  btn.dataset.cat = s.cat;
  btn.setAttribute('aria-label', s.name);
  btn.innerHTML = `<span class="num">${i}</span>`;
  btn.addEventListener('mouseenter', () => { if(!pinned) showPopup(btn, s); });
  btn.addEventListener('mouseleave', () => { if(!pinned) hidePopup(); });
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    hideChooser();
    const near = nearbyShops(s);
    if (near.length <= 1){
      if (pinned === btn){ hidePopup(); pinned=null; }
      else { pinned = btn; showPopup(btn, s); }
    } else {
      hidePopup(); pinned = btn; showChooser(near, btn);
    }
  });
  mapWrap.appendChild(btn);
});

STORES.forEach((s) => {
  const hasUrl = s.url && s.url !== '#';
  const row = document.createElement(hasUrl ? 'a' : 'div');
  row.className = `srow c-${s.cat}${hasUrl ? '' : ' disabled'}`;
  row.dataset.cat = s.cat;
  if (hasUrl){
    row.href = s.url;
    row.target = '_blank';
    row.rel = 'noopener';
  } else {
    row.setAttribute('role', 'listitem');
  }

  const dot = document.createElement('span');
  dot.className = 'cdot';
  const name = document.createElement('span');
  name.className = 'sname';
  name.textContent = s.name;
  const go = document.createElement('span');
  go.className = 'sgo';
  go.textContent = hasUrl ? '→' : '準備中';
  row.append(dot, name, go);
  shopList.appendChild(row);
});

function showPopup(btn, s){
  const c = CATEGORIES[s.cat];
  popupCat.innerHTML = `<span class="ic">${ICONS[s.cat]}</span>${c.label}`;
  popupCat.style.background = c.color;
  popupName.textContent = s.name;
  popupVoices.innerHTML = s.voices.map(v =>
    `<div class="voice">💬 ${v.text}${v.who?`<span class="who">— ${v.who}</span>`:''}</div>`).join('');
  if (s.url && s.url !== '#'){
    popupGo.href = s.url; popupGo.classList.remove('disabled');
    popupGo.style.background = c.color; popupGo.textContent = 'お店を見る →';
  } else { popupGo.removeAttribute('href'); popupGo.classList.add('disabled'); popupGo.textContent = 'サイト準備中'; }
  const wr = mapWrap.getBoundingClientRect(), pr = btn.getBoundingClientRect();
  const cy = pr.top - wr.top + pr.height/2;
  const shouldPlaceBelow = s.y < 16 || cy - popup.offsetHeight - 14 < 8;
  popup.classList.toggle('below', shouldPlaceBelow);
  let cx = pr.left - wr.left + pr.width/2;
  const half = Math.min(212, wr.width*0.76)/2 + 6;
  cx = Math.max(half, Math.min(wr.width - half, cx));
  popup.style.left = cx + 'px';
  popup.style.top  = cy + 'px';
  popup.classList.add('show');
}
function hidePopup(){ popup.classList.remove('show'); }
function hideChooser(){ chooser.classList.remove('show'); }
function nearbyShops(s){
  return STORES.filter(o => Math.abs(o.x - s.x) < 8 && Math.abs(o.y - s.y) < 3.5);
}
function showChooser(list, btn){
  while (chooser.firstChild) chooser.removeChild(chooser.firstChild);
  const t = document.createElement('div'); t.className = 'ctitle'; t.textContent = 'どのお店？'; chooser.appendChild(t);
  list.forEach(o => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'copt';
    const dot = document.createElement('span'); dot.className = 'cdot'; dot.style.background = CATEGORIES[o.cat].color;
    const nm = document.createElement('span'); nm.className = 'cnm'; nm.textContent = o.name;
    b.append(dot, nm);
    b.addEventListener('click', ev => { ev.stopPropagation(); hideChooser(); pinned = btn; showPopup(btn, o); });
    chooser.appendChild(b);
  });
  const wr = mapWrap.getBoundingClientRect(), pr = btn.getBoundingClientRect();
  const cy = pr.top - wr.top + pr.height / 2;
  chooser.classList.toggle('below', cy < 150);
  let cx = pr.left - wr.left + pr.width / 2;
  const half = Math.min(210, wr.width * 0.8) / 2 + 6;
  cx = Math.max(half, Math.min(wr.width - half, cx));
  chooser.style.left = cx + 'px';
  chooser.style.top = cy + 'px';
  chooser.classList.add('show');
}

document.getElementById('popupClose').addEventListener('click', e=>{ e.stopPropagation(); hidePopup(); pinned=null; });
popup.addEventListener('click', e=>e.stopPropagation());
chooser.addEventListener('click', e=>e.stopPropagation());
document.addEventListener('click', ()=>{ if(pinned){ hidePopup(); pinned=null; } hideChooser(); });

document.getElementById('filters').addEventListener('click', e=>{
  const chip = e.target.closest('.chip-f'); if(!chip) return;
  const on = chip.getAttribute('aria-pressed') === 'true';
  chip.setAttribute('aria-pressed', String(!on));
  const activeCats = new Set(
    [...document.querySelectorAll('.chip-f[aria-pressed="true"]')].map(c => c.dataset.cat)
  );
  document.querySelectorAll('.hit').forEach(p=> p.classList.toggle('glow', activeCats.has(p.dataset.cat)));
  document.querySelectorAll('.srow').forEach(row=>{
    row.style.display = activeCats.size === 0 || activeCats.has(row.dataset.cat) ? '' : 'none';
  });
});
</script>
