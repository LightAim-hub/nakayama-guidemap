<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なかやま商店街 デジタルガイドマップ</title>
<style>
  :root{
    --bg:#fdf6e9; --ink:#3a3531; --line:#d9cdb6;
    --road:#efe7d6; --road-line:#cdbf9e;
    --grass:#d6ebbf; --water:#bfe3ef; --park:#bfe0a8;
    /* カテゴリ色 */
    --c-medical:#2bb3a3;  /* 健康・美容・医療 */
    --c-life:#4a90d9;     /* 生活・日用・企業 */
    --c-food:#f0853c;     /* 食べる・飲む・食料 */
    --c-edu:#9b6fc4;      /* 保育・教育 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro",
                "Yu Gothic UI","Meiryo",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%;
  }
  header{
    text-align:center; padding:18px 16px 6px;
  }
  header h1{
    margin:0; font-size:clamp(20px,4.5vw,30px); letter-spacing:.04em;
  }
  header p{ margin:6px 0 0; font-size:13px; color:#8a7f6e; }

  /* カテゴリ絞り込みチップ */
  .filters{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    padding:12px 16px 4px; max-width:1000px; margin:0 auto;
  }
  .chip{
    border:2px solid currentColor; background:#fff; color:var(--ink);
    border-radius:999px; padding:6px 14px; font-size:13px; font-weight:700;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    user-select:none; transition:transform .08s, opacity .15s;
  }
  .chip:active{ transform:scale(.95) }
  .chip .dot{ width:11px; height:11px; border-radius:50%; background:currentColor }
  .chip[aria-pressed="false"]{ opacity:.35; }
  .chip.c-medical{ color:var(--c-medical) }
  .chip.c-life{ color:var(--c-life) }
  .chip.c-food{ color:var(--c-food) }
  .chip.c-edu{ color:var(--c-edu) }

  /* マップ領域 */
  .map-wrap{
    position:relative; width:100%; max-width:1000px; margin:10px auto 30px;
    aspect-ratio:1000/700; border:3px solid var(--line); border-radius:18px;
    overflow:hidden; box-shadow:0 8px 26px rgba(120,100,60,.18);
    background:var(--grass);
  }
  .map-bg{ position:absolute; inset:0; width:100%; height:100% }

  /* 店舗ピン */
  .pin{
    position:absolute; transform:translate(-50%,-100%);
    border:0; background:none; padding:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; line-height:1;
    transition:transform .12s; z-index:2;
  }
  .pin:hover,.pin:focus-visible{ transform:translate(-50%,-100%) scale(1.12); outline:none; z-index:5 }
  .pin .head{
    width:30px; height:30px; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg); background:#888;
    border:3px solid #fff; box-shadow:0 3px 6px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center;
  }
  .pin .head span{ transform:rotate(45deg); font-size:15px; }
  .pin .label{
    margin-top:4px; font-size:11px; font-weight:700; white-space:nowrap;
    background:rgba(255,255,255,.9); padding:1px 6px; border-radius:7px;
    box-shadow:0 1px 2px rgba(0,0,0,.12); color:var(--ink);
  }
  .pin.c-medical .head{ background:var(--c-medical) }
  .pin.c-life    .head{ background:var(--c-life) }
  .pin.c-food    .head{ background:var(--c-food) }
  .pin.c-edu     .head{ background:var(--c-edu) }
  .pin.hidden{ display:none }

  /* 子供の声ポップアップ */
  .popup{
    position:absolute; z-index:20; width:220px; max-width:78vw;
    transform:translate(-50%,calc(-100% - 44px));
    background:#fff; border:2px solid var(--line); border-radius:14px;
    box-shadow:0 10px 28px rgba(80,60,30,.28); padding:12px 13px 13px;
    opacity:0; pointer-events:none; transition:opacity .14s;
  }
  .popup.show{ opacity:1; pointer-events:auto }
  .popup::after{ /* 吹き出しの三角 */
    content:""; position:absolute; left:50%; bottom:-11px; transform:translateX(-50%);
    border:10px solid transparent; border-top-color:#fff;
    filter:drop-shadow(0 2px 1px rgba(80,60,30,.18));
  }
  .popup .cat{
    font-size:11px; font-weight:700; color:#fff; padding:2px 9px;
    border-radius:999px; display:inline-block; margin-bottom:6px;
  }
  .popup h3{ margin:0 0 8px; font-size:16px }
  .popup .voices{ display:flex; flex-direction:column; gap:7px; margin-bottom:11px }
  .voice{
    background:var(--bg); border-radius:10px 10px 10px 2px; padding:7px 9px;
    font-size:12.5px; line-height:1.45; position:relative;
  }
  .voice .who{ display:block; margin-top:3px; font-size:10.5px; color:#9a8e7a }
  .popup .go{
    display:flex; align-items:center; justify-content:center; gap:5px;
    width:100%; text-decoration:none; color:#fff; font-weight:700;
    padding:9px; border-radius:10px; font-size:13.5px;
  }
  .popup .go.disabled{ background:#bbb; pointer-events:none }
  .popup .close{
    position:absolute; top:6px; right:9px; border:0; background:none;
    font-size:18px; color:#b3a690; cursor:pointer; line-height:1;
  }
  .legend-note{ text-align:center; font-size:11px; color:#a59a86; margin:-14px 0 26px }
</style>
</head>
<body>

<header>
  <h1>🏘 なかやま商店街 ガイドマップ</h1>
  <p>こどもやファミリーが元気いっぱい過ごす街 — ピンをタップしてお店をのぞいてみよう！</p>
</header>

<div class="filters" id="filters">
  <button class="chip c-medical" data-cat="medical" aria-pressed="true"><i class="dot"></i>健康・美容・医療</button>
  <button class="chip c-life"    data-cat="life"    aria-pressed="true"><i class="dot"></i>生活・日用・企業</button>
  <button class="chip c-food"    data-cat="food"    aria-pressed="true"><i class="dot"></i>食べる・飲む・食料</button>
  <button class="chip c-edu"     data-cat="edu"     aria-pressed="true"><i class="dot"></i>保育・教育</button>
</div>

<div class="map-wrap" id="mapWrap">
  <!-- 装飾マップ背景（SVGで道・公園・川などを描画。仮レイアウト） -->
  <svg class="map-bg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect x="0" y="0" width="1000" height="700" fill="#d6ebbf"/>
    <!-- 川 -->
    <path d="M0,40 C200,90 250,10 1000,70 L1000,0 L0,0 Z" fill="#bfe3ef"/>
    <path d="M0,40 C200,90 250,10 1000,70" stroke="#a6d6e6" stroke-width="6" fill="none"/>
    <!-- 公園 -->
    <circle cx="820" cy="540" r="110" fill="#bfe0a8"/>
    <circle cx="780" cy="500" r="20" fill="#8ec46a"/>
    <circle cx="860" cy="520" r="24" fill="#8ec46a"/>
    <circle cx="820" cy="580" r="22" fill="#8ec46a"/>
    <text x="820" y="650" text-anchor="middle" font-size="20" fill="#6f9a4d" font-weight="bold">なかやま公園</text>
    <!-- 道路（メインストリート 縦・横） -->
    <rect x="430" y="60" width="120" height="640" fill="#efe7d6"/>
    <rect x="0" y="300" width="1000" height="110" fill="#efe7d6"/>
    <!-- 中央線（破線） -->
    <line x1="490" y1="60" x2="490" y2="700" stroke="#cdbf9e" stroke-width="3" stroke-dasharray="14 14"/>
    <line x1="0" y1="355" x2="1000" y2="355" stroke="#cdbf9e" stroke-width="3" stroke-dasharray="14 14"/>
    <!-- 区画（建物エリア） -->
    <g fill="#fff7e8" stroke="#e4d9bf" stroke-width="2">
      <rect x="60" y="120" width="320" height="140" rx="10"/>
      <rect x="60" y="450" width="320" height="190" rx="10"/>
      <rect x="600" y="120" width="330" height="140" rx="10"/>
      <rect x="600" y="450" width="120" height="120" rx="10"/>
    </g>
    <text x="220" y="110" text-anchor="middle" font-size="15" fill="#b3a07a">中山一丁目</text>
    <text x="765" y="110" text-anchor="middle" font-size="15" fill="#b3a07a">中山二丁目</text>
    <text x="510" y="690" text-anchor="middle" font-size="13" fill="#b3a07a">▲ 中山駅・バス通り方面</text>
  </svg>
  <!-- 店舗ピンはJSで生成 -->
</div>
<p class="legend-note">※ これは仮データ・仮レイアウトの雛形です。店舗・URL・コメント・ピン位置はファイル先頭の <code>STORES</code> を編集してください。</p>

<!-- 子供の声ポップアップ（1つを使い回す） -->
<div class="popup" id="popup" role="dialog">
  <button class="close" id="popupClose" aria-label="閉じる">×</button>
  <span class="cat" id="popupCat"></span>
  <h3 id="popupName"></h3>
  <div class="voices" id="popupVoices"></div>
  <a class="go" id="popupGo" target="_blank" rel="noopener">お店を見る →</a>
</div>

<script>
/* =========================================================================
   ▼▼▼ ここだけ編集すれば中身が変わります（仮データ） ▼▼▼
   - cat : "medical" | "life" | "food" | "edu"  （カテゴリ＝ピンの色）
   - url : 店舗サイトのURL（未定なら "#"。"#"のときはボタンが無効表示になります）
   - x,y : マップ上の位置（0〜100 の％。左上が 0,0／右下が 100,100）
   - voices : 子供の声コメント [{text:"声", who:"小2・ゆうと など（任意）"}]
   ========================================================================= */
const CATEGORIES = {
  medical:{ label:"健康・美容・医療", color:"#2bb3a3" },
  life:   { label:"生活・日用・企業", color:"#4a90d9" },
  food:   { label:"食べる・飲む・食料", color:"#f0853c" },
  edu:    { label:"保育・教育",        color:"#9b6fc4" },
};

const STORES = [
  { name:"みなみ歯科クリニック", cat:"medical", url:"#", x:14, y:26,
    voices:[ {text:"こわくなかった！せんせいやさしい", who:"小1・はると"},
             {text:"はみがきのれんしゅうしたよ", who:"年長・みお"} ] },
  { name:"中山鍼灸接骨院", cat:"medical", url:"#", x:30, y:24,
    voices:[ {text:"おじいちゃんのこしがよくなったって！", who:"小4・そうた"} ] },
  { name:"ウエルシア中山店", cat:"medical", url:"#", x:78, y:24,
    voices:[ {text:"ばんそうこうのキャラがかわいい", who:"小2・ゆい"} ] },

  { name:"七十七銀行 中山支店", cat:"life", url:"#", x:66, y:23,
    voices:[ {text:"おとしだまをちょきんした！", who:"小3・けんと"} ] },
  { name:"中山不動産", cat:"life", url:"#", x:20, y:70,
    voices:[ {text:"おうちのもけいがあったよ", who:"小2・あおい"} ] },
  { name:"ヨークベニマル中山店", cat:"life", url:"#", x:34, y:78,
    voices:[ {text:"おかしコーナーがすごい！", who:"小1・りく"},
             {text:"カートにのるのがすき", who:"年中・ひなた"} ] },
  { name:"ダイシン長命ヶ丘店", cat:"life", url:"#", x:88, y:70,
    voices:[ {text:"ぶんぼうぐがいっぱいでまよう", who:"小5・なな"} ] },

  { name:"レストランKAYA", cat:"food", url:"#", x:52, y:46,
    voices:[ {text:"オムライスがふわふわ！", who:"小2・ゆうと"},
             {text:"プリンがおおきい", who:"小1・さくら"} ] },
  { name:"ダイニングバー祭", cat:"food", url:"#", x:60, y:62,
    voices:[ {text:"おまつりみたいなのれんがすき", who:"小3・たいが"} ] },
  { name:"中華レストランとらの子", cat:"food", url:"#", x:46, y:60,
    voices:[ {text:"ぎょうざ100こたべたい！", who:"小2・こうき"},
             {text:"チャーハンがぴかぴか", who:"年長・めい"} ] },

  { name:"認定こども園TOBINOKO", cat:"edu", url:"#", x:48, y:18,
    voices:[ {text:"すべりだいが2かいあるよ", who:"年長・ひまり"} ] },
  { name:"中山市民センター", cat:"edu", url:"#", x:64, y:46,
    voices:[ {text:"おはなしかいがたのしい", who:"小1・ゆうな"} ] },
  { name:"中山中学校", cat:"edu", url:"#", x:80, y:90,
    voices:[ {text:"おにいちゃんがぶかつしてる", who:"小4・りお"} ] },
];
/* ▲▲▲ 編集ここまで ▲▲▲ */

const mapWrap = document.getElementById('mapWrap');
const popup = document.getElementById('popup');
const popupCat = document.getElementById('popupCat');
const popupName = document.getElementById('popupName');
const popupVoices = document.getElementById('popupVoices');
const popupGo = document.getElementById('popupGo');
let pinnedPin = null;   // クリックで固定表示中のピン

// ピン生成
STORES.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = `pin c-${s.cat}`;
  btn.style.left = s.x + '%';
  btn.style.top  = s.y + '%';
  btn.dataset.idx = i;
  btn.dataset.cat = s.cat;
  btn.setAttribute('aria-label', s.name);
  btn.innerHTML = `<span class="head"><span>📍</span></span><span class="label">${s.name}</span>`;
  // PC: ホバーでプレビュー
  btn.addEventListener('mouseenter', () => { if(!pinnedPin) showPopup(btn, s, false); });
  btn.addEventListener('mouseleave', () => { if(!pinnedPin) hidePopup(); });
  // クリック/タップ: 固定表示
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (pinnedPin === btn){ hidePopup(); pinnedPin=null; }
    else { pinnedPin = btn; showPopup(btn, s, true); }
  });
  mapWrap.appendChild(btn);
});

function showPopup(btn, s, pinned){
  const c = CATEGORIES[s.cat];
  popupCat.textContent = c.label;
  popupCat.style.background = c.color;
  popupName.textContent = s.name;
  popupVoices.innerHTML = s.voices.map(v =>
    `<div class="voice">💬 ${v.text}${v.who?`<span class="who">— ${v.who}</span>`:''}</div>`
  ).join('');
  // サイトリンク
  if (s.url && s.url !== '#'){
    popupGo.href = s.url;
    popupGo.classList.remove('disabled');
    popupGo.style.background = c.color;
    popupGo.textContent = 'お店を見る →';
  } else {
    popupGo.removeAttribute('href');
    popupGo.classList.add('disabled');
    popupGo.textContent = 'サイト準備中';
  }
  // 位置（ピンの中心上に）
  const wrapRect = mapWrap.getBoundingClientRect();
  const pinRect = btn.getBoundingClientRect();
  const cx = pinRect.left - wrapRect.left + pinRect.width/2;
  const cy = pinRect.top  - wrapRect.top;
  popup.style.left = cx + 'px';
  popup.style.top  = cy + 'px';
  popup.classList.add('show');
}
function hidePopup(){ popup.classList.remove('show'); }

document.getElementById('popupClose').addEventListener('click', (e)=>{
  e.stopPropagation(); hidePopup(); pinnedPin=null;
});
popup.addEventListener('click', e=>e.stopPropagation());
// 余白クリックで閉じる
document.addEventListener('click', ()=>{ if(pinnedPin){ hidePopup(); pinnedPin=null; } });

// カテゴリ絞り込み
document.getElementById('filters').addEventListener('click', e=>{
  const chip = e.target.closest('.chip'); if(!chip) return;
  const on = chip.getAttribute('aria-pressed') === 'true';
  chip.setAttribute('aria-pressed', String(!on));
  const cat = chip.dataset.cat;
  document.querySelectorAll(`.pin[data-cat="${cat}"]`).forEach(p=>{
    p.classList.toggle('hidden', on);
  });
  if(pinnedPin && pinnedPin.classList.contains('hidden')){ hidePopup(); pinnedPin=null; }
});
</script>
</body>
</html>
