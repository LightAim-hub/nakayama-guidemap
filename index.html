<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なかやま商店街 デジタルガイドマップ</title>
<style>
  :root{
    --bg:#fdf6e9; --ink:#3a3531; --line:#e0d4ba;
    --c-medical:#2bb3a3;  /* 健康・美容・医療 */
    --c-life:#4a9d3f;     /* 生活・日用・企業 */
    --c-food:#f0a83c;     /* 食べる・飲む・食料 */
    --c-edu:#7e8ad6;      /* 保育・教育 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro",
                "Yu Gothic UI","Meiryo",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%;
  }
  header{ text-align:center; padding:18px 16px 4px; }
  header h1{ margin:0; font-size:clamp(19px,4.5vw,28px); letter-spacing:.03em; }
  header p{ margin:6px 0 0; font-size:13px; color:#8a7f6e; }

  .filters{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    padding:12px 14px 4px; max-width:640px; margin:0 auto;
  }
  .chip{
    border:2px solid currentColor; background:#fff; color:var(--ink);
    border-radius:999px; padding:5px 13px; font-size:12.5px; font-weight:700;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    user-select:none; transition:transform .08s, opacity .15s;
  }
  .chip:active{ transform:scale(.95) }
  .chip .dot{ width:10px; height:10px; border-radius:50%; background:currentColor }
  .chip[aria-pressed="false"]{ opacity:.35 }
  .chip.c-medical{ color:var(--c-medical) }
  .chip.c-life{ color:var(--c-life) }
  .chip.c-food{ color:var(--c-food) }
  .chip.c-edu{ color:var(--c-edu) }

  /* マップ領域：実画像を背景に */
  .map-wrap{
    position:relative; width:100%; max-width:620px; margin:10px auto 8px;
    border:3px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:0 8px 24px rgba(120,100,60,.18); background:#fff;
  }
  .map-wrap img{ display:block; width:100%; height:auto; }

  /* 店舗マーカー（地図上の点） */
  .pin{
    position:absolute; transform:translate(-50%,-50%);
    width:20px; height:20px; border-radius:50%;
    border:3px solid #fff; cursor:pointer; padding:0; z-index:2;
    box-shadow:0 2px 5px rgba(0,0,0,.35);
    transition:transform .12s; background:#888;
  }
  .pin::after{ /* パルス */
    content:""; position:absolute; inset:-3px; border-radius:50%;
    border:2px solid currentColor; opacity:.6; animation:pulse 2s infinite;
  }
  @keyframes pulse{ 0%{transform:scale(1);opacity:.6} 70%{transform:scale(2.1);opacity:0} 100%{opacity:0} }
  .pin:hover,.pin:focus-visible{ transform:translate(-50%,-50%) scale(1.35); outline:none; z-index:6 }
  .pin.c-medical{ background:var(--c-medical); color:var(--c-medical) }
  .pin.c-life{ background:var(--c-life); color:var(--c-life) }
  .pin.c-food{ background:var(--c-food); color:var(--c-food) }
  .pin.c-edu{ background:var(--c-edu); color:var(--c-edu) }
  .pin.hidden{ display:none }
  .pin .num{ /* debugモード用の番号 */
    position:absolute; left:50%; top:-18px; transform:translateX(-50%);
    font-size:10px; color:#000; background:#fff; padding:0 3px; border-radius:3px;
    display:none; white-space:nowrap;
  }
  body.debug .pin .num{ display:block }

  /* 子供の声ポップアップ */
  .popup{
    position:absolute; z-index:20; width:210px; max-width:74vw;
    background:#fff; border:2px solid var(--line); border-radius:13px;
    box-shadow:0 10px 26px rgba(80,60,30,.3); padding:11px 12px 12px;
    opacity:0; pointer-events:none; transition:opacity .14s;
    transform:translate(-50%,calc(-100% - 18px));
  }
  .popup.below{ transform:translate(-50%,18px) }
  .popup.show{ opacity:1; pointer-events:auto }
  .popup::after{
    content:""; position:absolute; left:50%; bottom:-11px; transform:translateX(-50%);
    border:10px solid transparent; border-top-color:#fff;
    filter:drop-shadow(0 2px 1px rgba(80,60,30,.18));
  }
  .popup.below::after{ bottom:auto; top:-11px; border-top-color:transparent; border-bottom-color:#fff;
    filter:drop-shadow(0 -2px 1px rgba(80,60,30,.18)); }
  .popup .cat{
    font-size:11px; font-weight:700; color:#fff; padding:2px 9px;
    border-radius:999px; display:inline-block; margin-bottom:6px;
  }
  .popup h3{ margin:0 0 7px; font-size:15px }
  .popup .voices{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px }
  .popup .voices:empty{ display:none }
  .voice{
    background:var(--bg); border-radius:10px 10px 10px 2px; padding:6px 9px;
    font-size:12.5px; line-height:1.45;
  }
  .voice .who{ display:block; margin-top:3px; font-size:10.5px; color:#9a8e7a }
  .popup .go{
    display:flex; align-items:center; justify-content:center; gap:5px;
    width:100%; text-decoration:none; color:#fff; font-weight:700;
    padding:9px; border-radius:10px; font-size:13px;
  }
  .popup .go.disabled{ background:#bbb; pointer-events:none }
  .popup .close{
    position:absolute; top:5px; right:9px; border:0; background:none;
    font-size:18px; color:#b3a690; cursor:pointer; line-height:1;
  }
  .note{ text-align:center; font-size:11px; color:#a59a86; margin:6px 16px 28px; line-height:1.6 }
</style>
</head>
<body>

<header>
  <h1>🏘 なかやま商店街 デジタルガイドマップ</h1>
  <p>こどもやファミリーが元気いっぱい過ごす街 — 地図の丸印をタップしてお店をのぞいてみよう！</p>
</header>

<div class="filters" id="filters">
  <button class="chip c-medical" data-cat="medical" aria-pressed="true"><i class="dot"></i>健康・美容・医療</button>
  <button class="chip c-life"    data-cat="life"    aria-pressed="true"><i class="dot"></i>生活・日用・企業</button>
  <button class="chip c-food"    data-cat="food"    aria-pressed="true"><i class="dot"></i>食べる・飲む・食料</button>
  <button class="chip c-edu"     data-cat="edu"     aria-pressed="true"><i class="dot"></i>保育・教育</button>
</div>

<div class="map-wrap" id="mapWrap">
  <img src="map.png" alt="なかやま商店街マップ" id="mapImg">
  <!-- マーカーはJSで生成 -->
</div>

<p class="note">
  ※ マーカー位置・店名・カテゴリは手描きマップからの読み取り（暫定）です。<br>
  店舗・URL・子供コメント・位置はファイル先頭の <code>STORES</code> を編集してください。URL未設定の店は「サイト準備中」と表示されます。
</p>

<div class="popup" id="popup" role="dialog">
  <button class="close" id="popupClose" aria-label="閉じる">×</button>
  <span class="cat" id="popupCat"></span>
  <h3 id="popupName"></h3>
  <div class="voices" id="popupVoices"></div>
  <a class="go" id="popupGo" target="_blank" rel="noopener">お店を見る →</a>
</div>

<script>
/* =========================================================================
   ▼▼▼ ここだけ編集すれば中身が変わります ▼▼▼
   - cat : "medical"(健康美容医療) | "life"(生活日用企業) | "food"(食) | "edu"(保育教育)
   - url : 店舗サイトURL（未定なら "#"）
   - x,y : マップ画像上の位置（0〜100 の％。左上0,0／右下100,100）
            位置がズレている場合はこの数値を微調整してください。
   - voices : 子供の声 [{text:"声", who:"小2・ゆうと 等（任意）"}]  ※現状サンプル
   ========================================================================= */
const CATEGORIES = {
  medical:{ label:"健康・美容・医療", color:"#2bb3a3" },
  life:   { label:"生活・日用・企業", color:"#4a9d3f" },
  food:   { label:"食べる・飲む・食料", color:"#f0a83c" },
  edu:    { label:"保育・教育",        color:"#7e8ad6" },
};

const STORES = [
  { name:"ヨークベニマル 仙台中山店", cat:"life", url:"#", x:39.9, y:10.5,
    voices:[ {text:"おかしコーナーがすごい！", who:"小1・りく"} ] },
  { name:"七十七銀行 中山支店", cat:"life", url:"#", x:38.4, y:21.7, voices:[] },
  { name:"ウジエスーパー中山店", cat:"life", url:"#", x:37.9, y:26.9,
    voices:[ {text:"おさかなコーナーがにぎやか", who:"小3・あおい"} ] },
  { name:"みなみ歯科クリニック", cat:"medical", url:"#", x:72.5, y:7.8,
    voices:[ {text:"こわくなかった！せんせいやさしい", who:"小1・はると"} ] },
  { name:"ダイシン長命ヶ丘店", cat:"life", url:"#", x:78.6, y:11.2, voices:[] },
  { name:"リハビリステーション中山", cat:"medical", url:"#", x:56.1, y:16.1, voices:[] },
  { name:"志藤整骨院", cat:"medical", url:"#", x:55.6, y:18.3, voices:[] },
  { name:"BURB usedclothing", cat:"life", url:"#", x:55.6, y:20.2, voices:[] },
  { name:"レストランKAYA", cat:"food", url:"#", x:55.6, y:22.0,
    voices:[ {text:"オムライスがふわふわ！", who:"小2・ゆうと"},
             {text:"プリンがおおきい", who:"小1・さくら"} ] },
  { name:"中山郵便局", cat:"life", url:"#", x:55.1, y:23.9, voices:[] },
  { name:"中山歯科", cat:"medical", url:"#", x:55.1, y:25.8, voices:[] },
  { name:"中山中学校", cat:"edu", url:"#", x:82.7, y:22.0, voices:[] },
  { name:"中山市民センター", cat:"edu", url:"#", x:20.5, y:41.5,
    voices:[ {text:"おはなしかいがたのしい", who:"小1・ゆうな"} ] },
  { name:"中華レストランとらの子", cat:"food", url:"#", x:57.1, y:40.0,
    voices:[ {text:"ぎょうざ100こたべたい！", who:"小2・こうき"} ] },
  { name:"中山不動産", cat:"life", url:"#", x:54.6, y:43.4, voices:[] },
  { name:"ダイニングバー祭", cat:"food", url:"#", x:55.6, y:44.9,
    voices:[ {text:"おまつりみたいなのれんがすき", who:"小3・たいが"} ] },
  { name:"中山接骨院", cat:"medical", url:"#", x:55.1, y:58.3, voices:[] },
  { name:"フラワー中山", cat:"life", url:"#", x:54.6, y:60.2, voices:[] },
  { name:"河村内科外科クリニック", cat:"medical", url:"#", x:56.1, y:62.1, voices:[] },
  { name:"カットショップ NOBU", cat:"medical", url:"#", x:57.1, y:73.1, voices:[] },
  { name:"西原歯科医院", cat:"medical", url:"#", x:45.0, y:74.6, voices:[] },
  { name:"cake NAO", cat:"food", url:"#", x:56.1, y:76.8,
    voices:[ {text:"いちごのケーキがかわいい", who:"小2・めい"} ] },
  { name:"中山小学校", cat:"edu", url:"#", x:79.6, y:72.0,
    voices:[ {text:"こうていがひろい！", who:"小4・りお"} ] },
  { name:"認定こども園 TOBINOKO", cat:"edu", url:"#", x:25.6, y:78.7,
    voices:[ {text:"すべりだいが2かいあるよ", who:"年長・ひまり"} ] },
  { name:"中山ドライブスクール", cat:"life", url:"#", x:56.1, y:81.0, voices:[] },
];
/* ▲▲▲ 編集ここまで ▲▲▲ */

const mapWrap = document.getElementById('mapWrap');
const popup = document.getElementById('popup');
const popupCat = document.getElementById('popupCat');
const popupName = document.getElementById('popupName');
const popupVoices = document.getElementById('popupVoices');
const popupGo = document.getElementById('popupGo');
let pinnedPin = null;

if (location.search.indexOf('debug') >= 0) document.body.classList.add('debug');

STORES.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = `pin c-${s.cat}`;
  btn.style.left = s.x + '%';
  btn.style.top  = s.y + '%';
  btn.dataset.idx = i;
  btn.dataset.cat = s.cat;
  btn.setAttribute('aria-label', s.name);
  btn.innerHTML = `<span class="num">${i}:${s.name}</span>`;
  btn.addEventListener('mouseenter', () => { if(!pinnedPin) showPopup(btn, s); });
  btn.addEventListener('mouseleave', () => { if(!pinnedPin) hidePopup(); });
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (pinnedPin === btn){ hidePopup(); pinnedPin=null; }
    else { pinnedPin = btn; showPopup(btn, s); }
  });
  mapWrap.appendChild(btn);
});

function showPopup(btn, s){
  const c = CATEGORIES[s.cat];
  popupCat.textContent = c.label;
  popupCat.style.background = c.color;
  popupName.textContent = s.name;
  popupVoices.innerHTML = s.voices.map(v =>
    `<div class="voice">💬 ${v.text}${v.who?`<span class="who">— ${v.who}</span>`:''}</div>`
  ).join('');
  if (s.url && s.url !== '#'){
    popupGo.href = s.url; popupGo.classList.remove('disabled');
    popupGo.style.background = c.color; popupGo.textContent = 'お店を見る →';
  } else {
    popupGo.removeAttribute('href'); popupGo.classList.add('disabled');
    popupGo.textContent = 'サイト準備中';
  }
  const wrapRect = mapWrap.getBoundingClientRect();
  const pinRect = btn.getBoundingClientRect();
  const cx = pinRect.left - wrapRect.left + pinRect.width/2;
  const cy = pinRect.top  - wrapRect.top  + pinRect.height/2;
  // 上端付近は吹き出しを下向きに
  const below = (s.y < 22);
  popup.classList.toggle('below', below);
  popup.style.left = cx + 'px';
  popup.style.top  = cy + 'px';
  popup.classList.add('show');
}
function hidePopup(){ popup.classList.remove('show'); }

document.getElementById('popupClose').addEventListener('click', (e)=>{
  e.stopPropagation(); hidePopup(); pinnedPin=null;
});
popup.addEventListener('click', e=>e.stopPropagation());
document.addEventListener('click', ()=>{ if(pinnedPin){ hidePopup(); pinnedPin=null; } });

document.getElementById('filters').addEventListener('click', e=>{
  const chip = e.target.closest('.chip'); if(!chip) return;
  const on = chip.getAttribute('aria-pressed') === 'true';
  chip.setAttribute('aria-pressed', String(!on));
  const cat = chip.dataset.cat;
  document.querySelectorAll(`.pin[data-cat="${cat}"]`).forEach(p=> p.classList.toggle('hidden', on));
  if(pinnedPin && pinnedPin.classList.contains('hidden')){ hidePopup(); pinnedPin=null; }
});
</script>
</body>
</html>
